name: Build iOS IPA (GoldCraft)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build:mobile

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App with Xcode
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            VALIDATE_PRODUCT=NO

      - name: Package .ipa
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find ios/App/build/Build/Products -name "App.app" -type d | head -n 1)
          echo "Found App bundle at: $APP_PATH"
          cp -r "$APP_PATH" build/Payload/GoldCraft.app
          cd build
          zip -r GoldCraft.ipa Payload

      - name: Upload .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoldCraft-iOS-IPA
          path: build/GoldCraft.ipa
          retention-days: 14
